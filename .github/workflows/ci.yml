name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      # Offline tests only: SDKs and the `claude` CLI are faked or stubbed, no secrets needed.
      - run: pytest test_backend.py test_judge.py test_common.py -q
